name: Wrong or missing finding
description: The scanner reports something it should not, misses something, or fails.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reduce the code to the API call that matters; do not paste private code.
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The smallest Swift code, Info.plist or build setting that shows the problem.
      render: swift
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What the scanner reported
      description: Paste the output of `migration-scan --format xcode`, or the error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `migration-scan --version`, and the Xcode version.
    validations:
      required: true
