name: Rule request
description: Suggest a deprecation, removal or SDK requirement the scanner should report.
labels: ["enhancement"]
body:
  - type: input
    id: api
    attributes:
      label: API or setting
      description: For example `UIApplication.shared.windows` or `INFOPLIST_KEY_UIDesignRequiresCompatibility`.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Where Apple says so
      description: The SDK header or Swift interface declaration with its deprecation, or a link to Apple's documentation.
    validations:
      required: true
  - type: textarea
    id: replacement
    attributes:
      label: Replacement
      description: What code should use instead.
  - type: textarea
    id: samples
    attributes:
      label: Samples
      description: Code the rule must report, and similar code it must leave alone.
      render: swift
