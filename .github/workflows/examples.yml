# Repository-specific: builds the example app that the README and guide samples are copied from,
# and runs its UI tests on an iPhone simulator.
name: Example app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: MigrationLab (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version

      - name: Build
        working-directory: Examples/MigrationLab
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -o pipefail
          xcodebuild build -project MigrationLab.xcodeproj -scheme MigrationLab \
            -destination "$DESTINATION" -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO -quiet

  ui-tests:
    name: MigrationLab UI tests (iOS simulator)
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test
        working-directory: Examples/MigrationLab
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "::error::No available iPhone simulator on this image"
            exit 1
          fi
          xcodebuild test -project MigrationLab.xcodeproj -scheme MigrationLab -destination "id=$udid" \
            -skipPackagePluginValidation -skipMacroValidation -quiet
